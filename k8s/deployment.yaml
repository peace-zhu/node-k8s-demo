# ============================================================================
# Deployment —— 声明「我要这个应用以什么形态持续存在」
# ============================================================================
#
# 你只写「我要 2 个副本、长什么样」，具体怎么建、坏了怎么补，由控制器负责。
#
# 【和 docker run 的对照】
#   docker run -d --name demo -p 38090:3000 -e APP_ENV=test node-k8s-demo:v1
#   ↑ 命令式：执行一次就结束，之后没人管；机器重启它就永久死了（默认 --restart=no）
#
#   下面这份文件
#   ↑ 声明式：K8s 持续比对「期望」和「实际」，不一致就修正，永远管着
# ============================================================================

apiVersion: apps/v1 # API 组 + 版本；Deployment 属于 apps 组
kind: Deployment # 资源类型
metadata:
  name: node-k8s-demo # 这个名字会成为 Pod 名字的第一段
  labels:
    app: node-k8s-demo

spec:
  replicas: 2 # ★ 期望副本数：始终保证有 2 个 Pod 在跑（少了补、多了删、挂了重建）

  selector: # 「我管哪些 Pod？」—— 靠标签匹配来认领
    matchLabels:
      app: node-k8s-demo # ⚠️ 必须和下面 template.metadata.labels 完全一致

  # ----------------------------------------------------------------
  # 滚动更新策略（不写也有默认值，这里显式写出来方便理解）
  # ----------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 升级时最多可以"多"起多少 Pod（这里 2 个副本 → 允许临时多 1 个）
      maxSurge: 1
      # 升级时最多允许有几个 Pod 不可用（0 = 全程保证 2 个都能服务 → 零停机）
      maxUnavailable: 0
  # ⚠️ maxUnavailable: 0 是"零停机"的关键；但它要求新 Pod 必须能变成 Ready，
  #    否则升级会一直卡住 —— 这就是下面 readinessProbe 必须配的原因。

  # 保留最近几代 ReplicaSet（回滚的余地）。旧的会缩到 0 个 Pod，但对象保留着。
  revisionHistoryLimit: 10

  template: # 「新 Pod 长什么样？」—— Pod 模板（模具）
    metadata:
      labels:
        app: node-k8s-demo # ⚠️ 必须与上面的 matchLabels 一致（这就是认领凭证）
    spec:
      # ------------------------------------------------------------
      # 容器定义
      # ------------------------------------------------------------
      containers:
        - name: app # 容器名
          image: node-k8s-demo:v1 # 用哪个镜像
          # 拉取策略：本地有就用本地的。
          # ⚠️ 别写 Always —— 它会忽略本地已有镜像，强制去仓库拉，
          #    在受限网络里必然失败（我们踩过这个坑）
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000 # 容器里应用监听的端口（= app.js 的 PORT）

          # ----------------------------------------------------------
          # 配置注入：把 ConfigMap 的每个键变成容器里的环境变量
          # ----------------------------------------------------------
          # envFrom 是"整份注入"；如果只想注入某几个键，用 env + valueFrom
          envFrom:
            - configMapRef:
                name: node-k8s-demo-config # ← 对应 configmap.yaml 里的名字

          # 单独补一个"Pod 自己的名字"进去（教学用，方便首页显示）
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # ----------------------------------------------------------
          # 健康探针 —— 这一节是阶段 3 的内容，先跑起来，知道它的作用就行
          # ----------------------------------------------------------
          # readinessProbe（就绪探针）：决定这个 Pod 能不能被加进 Service 的后端列表
          #   → 没就绪的 Pod 收不到流量
          #   → 滚动更新时"新 Pod 变成 Ready"才继续往下换，这是零停机的必要条件
          readinessProbe:
            httpGet:
              path: /readyz # ← 对应 app.js 里的 /readyz
              port: 3000
            initialDelaySeconds: 3 # 容器启动后等几秒再开始探测
            periodSeconds: 5 # 每 5 秒探一次
            failureThreshold: 3 # 连续失败 3 次判定为"未就绪"

          # livenessProbe（存活探针）：判断容器是否需要被重启
          #   → 失败达到阈值 → kubelet 重启容器（注意：是"重启容器"，不是"新建 Pod"）
          livenessProbe:
            httpGet:
              path: /healthz # ← 对应 app.js 里的 /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # ----------------------------------------------------------
          # 🔴 资源限制 —— 生产必填，本项目先注释着（阶段 6 讲完再打开）
          # ----------------------------------------------------------
          # 不写的话，一个内存泄漏的容器能把整台机器拖死；
          # requests 影响调度（挑得下才调度），limits 是硬上限（超了被限流/OOMKilled）。
          # resources:
          #   requests:
          #     cpu: "100m"        # 0.1 核
          #     memory: "128Mi"
          #   limits:
          #     cpu: "500m"
          #     memory: "256Mi"

      # 容器挂了怎么办：Always = 总是重启（Deployment 的标准值）
      # ⚠️ 注意层级：restartPolicy 管的是「容器」，ReplicaSet 管的是「Pod」——
      #    容器进程挂了 → 原地重启容器；整个 Pod 没了 → ReplicaSet 新建一个 Pod
      restartPolicy: Always

      # 删除 Pod 时给它多少秒优雅退出（app.js 里处理了 SIGTERM）
      terminationGracePeriodSeconds: 30
