# ============================================================================
# ConfigMap —— 存放「会随环境变化的、不敏感的」配置
# ============================================================================
#
# 【它解决什么问题】
#   同一个镜像要跑 test / UAT / prod。如果配置烧进镜像，就得烤三个镜像，
#   改一行配置要重建三次 —— "一次构建、处处运行"就废了。
#
#   所以：镜像只装不变的东西（代码、依赖、运行时）；
#         会变的东西（环境标识、数据库地址、开关）用 ConfigMap 在运行时注入。
#
# 【和 Secret 的区别】
#   ConfigMap：明文，适合普通配置（环境名、地址、开关）
#   Secret   ：存放密码 / 密钥 / 证书，K8s 里单独一类对象（后续讲）
#
# ⚠️ 改了 ConfigMap 之后，已经运行的 Pod 不会自动读取新值
#    → 需要重启 Pod（kubectl rollout restart deploy/...）才生效
#    → 想自动 reload 要靠额外的工具（如 reloader），后续讲
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: node-k8s-demo-config # ← 这个名字在 Deployment 的 envFrom 里被引用

data:
  # 这里全是「纯文本键值对」。key 就是环境变量名
  APP_ENV: "test" # 应用读它来做环境区分（对应 app.js 里的 process.env.APP_ENV）
  GREETING: "你好" # 应用读它拼首页的问候语 —— 改这个值重启 Pod 就能看到变化
  NODE_ENV: "production"
