# ============================================================================
# Service —— 给一组 Pod 一个「固定不变的访问入口」
# ============================================================================
#
# 【它解决什么问题】
#   Pod 被删除后会"换一个新的"：新名字 + 新 IP。而 Pod IP 只在集群内部有效。
#   所以「把 Pod IP 写死到某处」这条路是死的。
#
#   Service 不记 IP，它记「标签」。
#   只要 Pod 身上有匹配的标签，就自动被纳入后端列表；Pod 生生死死，入口岿然不动。
#
# 【三个关键属性】
#   1. 一个固定的虚拟 IP（ClusterIP）—— 永不变（而且它不绑在任何网卡上）
#   2. 一个固定的 DNS 名字 —— node-k8s-demo-svc.default.svc.cluster.local
#   3. 后端列表自动维护 —— 靠 label 认领，Pod 换 IP 自动跟上
# ============================================================================

apiVersion: v1 # Service 属于核心 API 组，所以是 v1（不是 apps/v1）
kind: Service

metadata:
  name: node-k8s-demo-svc # 这个名字同时就是集群内部的 DNS 名

spec:
  # 暴露类型，三种：
  #   ClusterIP    —— 只在集群内部可达（默认值，生产中 99% 用这个）
  #   NodePort     —— 在每个节点上开一个端口，集群外可用 ← 本练习用这个
  #   LoadBalancer —— 向云厂商申请外部负载均衡器（本地环境不生效）
  type: NodePort

  selector: # ★ 核心：靠「标签」认领后端，不靠 IP
    app: node-k8s-demo # ⚠️ 必须与 deployment.yaml 里 template.metadata.labels 完全一致

  ports:
    - name: http
      port: 80 # ① Service 自己的端口（集群内部访问：http://node-k8s-demo-svc:80）
      targetPort: 3000 # ② 转发到 Pod 的哪个端口（⚠️ 必须等于容器真正监听的端口）
      nodePort: 30081 # ③ 每个节点上开的端口，集群外访问：http://<节点IP>:30081
      #    取值范围固定 30000-32767
      #    ⚠️ 30080 已经被 lab01-svc 占了，同一个节点上不能重复
      protocol: TCP

# ============================================================================
# 三个端口，别混。完整流量路径：
# ============================================================================
#
#   集群外部
#      │  curl http://172.20.0.2:30081     ← nodePort（节点上开的门）
#      ▼
#   节点（kube-proxy 在这里落转发规则）
#      │
#      ▼
#   Service 的虚拟 IP（10.96.x.x）
#      │  port 80                          ← port（Service 自己的门）
#      ▼
#   后端列表（Endpoints）里的某个 Pod
#      │  targetPort 3000                  ← 容器真正在听的门
#      ▼
#   你的 node app.js
#
# 记忆法：从左往右读 = 从外面往里走
#   nodePort（最外面）→ port（Service）→ targetPort（容器里）
# ============================================================================
